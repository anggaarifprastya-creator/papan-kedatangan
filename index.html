  window.SBY = window.SBY || {};
  if (window.SBY.StationStore) return;

  var CODES = ["CME","TES","SBI","SB","SGU","WO","SPJ","WR","GDG","SDA","PR","KRN"];
  var NAMES = {CME:"Cerme", TES:"Tandes", SBI:"Surabaya Pasarturi", SB:"Surabaya Kota", SGU:"Surabaya Gubeng", WO:"Wonokromo", SPJ:"Sepanjang", WR:"Waru", GDG:"Gedangan", SDA:"Sidoarjo", PR:"Porong", KRN:"Krian"};
  var CANONICAL_KEY = "sbySelectedStations";
  var LEGACY_KEYS = ["sbySelectedStation","sbyStation","sbyPilihStasiun","sbyStationCode","sbyStasiun"];

(function(){
  function applyGubengAlign(){
    try{
      var isLandscape = window.matchMedia('(orientation: landscape)').matches;
      var isDesktop = window.innerWidth >= 640;

          if(p.classList && p.classList.contains('flex') && p.classList.contains('overflow-x-auto')){
            p.style.justifyContent = shouldRight ? 'flex-end' : 'center';

            break;
          }
          p = p.parentElement;
        }
      });
    }catch(e){}
  }
  window.addEventListener('resize', applyGubengAlign);
  window.addEventListener('orientationchange', applyGubengAlign);
  document.addEventListener('DOMContentLoaded', applyGubengAlign);

  setInterval(applyGubengAlign, 800);

  setTimeout(applyGubengAlign, 500);
})();

(function(){
  function processCard(card){
    try{
      if(card.dataset.processedBottom==='1') {

        var bottom = card.querySelector('div[data-detail-bottom="1"]');
        if(bottom && bottom.querySelector('span')) return;
      }
      var flexWrap = card.querySelector('div.flex.flex-wrap');
      if(!flexWrap) return;
      var spans = flexWrap.querySelectorAll('span');
      var detail = null;
      for(var i=0;i<spans.length;i++){
        var t = (spans[i].textContent||'').trim();
        if(t==='Lihat Detail' || t==='Tutup Detail'){
          detail = spans[i];
          break;
        }
      }
      if(!detail) return;
      var bottom = card.querySelector('div[data-detail-bottom="1"]');
      if(!bottom){
        bottom = document.createElement('div');
        bottom.setAttribute('data-detail-bottom','1');
        bottom.style.width='100%';
        bottom.style.display='flex';
        bottom.style.justifyContent='flex-start';
        bottom.style.marginTop='10px';
        bottom.style.paddingTop='2px';
        card.appendChild(bottom);
      }
      if(detail.parentElement!==bottom){
        bottom.appendChild(detail);
      }
      detail.style.visibility='visible';
      card.dataset.processedBottom='1';
    }catch(e){}
  }
  function processAll(){
    var cards = document.querySelectorAll('div.px-4.py-3\\.5');
    if(!cards.length){
      cards = document.querySelectorAll('[class*="px-4"][class*="py-3.5"]');
    }
    cards.forEach(processCard);
  }

  var observer = new MutationObserver(function(mutations){
    var shouldProcess = false;
    for(var i=0;i<mutations.length;i++){
      if(mutations[i].addedNodes && mutations[i].addedNodes.length){
        shouldProcess = true;
        break;
      }
    }
    if(shouldProcess){

      requestAnimationFrame(processAll);
    }

    observer.observe(document.body, {childList:true, subtree:true});
  }

    startObserver();

    setTimeout(processAll, 100);
    setTimeout(processAll, 300);
  });

  if(document.readyState!=='loading'){
    processAll();
    startObserver();
  }

  setInterval(processAll, 1000);
})();

}catch(e){}

(function(){

    function buildText(rows){

    function todayStr(){
      var d = new Date();
      var dd = String(d.getDate());
      if(dd.length < 2) dd = '0' + dd;
      var mm = String(d.getMonth() + 1);
      if(mm.length < 2) mm = '0' + mm;
      var yy = String(d.getFullYear() % 100);
      if(yy.length < 2) yy = '0' + yy;
      return dd + '/' + mm + '/' + yy;
    }
    function footerUpdateStr(){
      var months = {'januari':'01','februari':'02','maret':'03','april':'04','mei':'05','juni':'06','juli':'07','agustus':'08','september':'09','oktober':'10','november':'11','desember':'12'};
      try{
        var els = document.querySelectorAll('footer div, footer span, #root div, #root span');
        for(var i = 0; i < els.length; i++){
          var txt = (els[i].textContent || '').trim();
          var m = txt.match(/Update:\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
          if(m){
            var dd = m[1];
            if(dd.length < 2) dd = '0' + dd;
            var mm = months[m[2].toLowerCase()] || '01';
            var yy = m[3].substring(2);
            return dd + '/' + mm + '/' + yy;
          }
        }
      }catch(e){}
      return todayStr();
    }
    function titleCase(str){
      var words = (str || '').toLowerCase().split(' ');
      var out = [];
      for(var i = 0; i < words.length; i++){
        var w = words[i];
        if(w) out.push(w.charAt(0).toUpperCase() + w.substring(1));
      }
      return out.join(' ');
    }
    function shortTrainName(name){
      return (name || '').replace(/Commuter Line/gi, 'CL');
    }
    function originInfo(route){
      var r = route || '';
      var parts = r.indexOf('→') !== -1 ? r.split('→') : r.split('->');
      var origin = (parts[0] || '').trim();
      if(!origin) return {code:'', name:''};
      if(origin.toLowerCase().indexOf('stasiun ') === 0) origin = origin.substring(8).trim();
      var key = origin.toLowerCase();
      var code = originCodes[key] || origin.toUpperCase();
      var name = originNames[code] || titleCase(origin);
      return {code: code, name: name};
    }
    var groups = {};
    var seen = [];
    rows.forEach(function(r){
      var code = String(r.station || '').trim().toUpperCase();
      if(!code) code = '—';
      if(!groups[code]){ groups[code] = []; seen.push(code); }
      groups[code].push(r);
    });
    var ordered = stationOrder.filter(function(c){ return groups[c]; });
    seen.forEach(function(c){ if(ordered.indexOf(c) === -1) ordered.push(c); });
    var lines = [];
    lines.push('*JADWAL KEDATANGAN KERETA*');

        if(a.code < b.code) return -1;

        return 0;
      });
      lines.push('');

      });
    }

  function copyText(text, done){

        navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, done); });

  function fallbackCopy(text, done){
    try{
      var ta = document.createElement('textarea');

    function isFilterValueActive(val){

      for(var j = 0; j < fields.length; j++){

      return false;
    }
    return false;

function getCopySelectedStation(){

      window.addEventListener('storage', function(){ setTimeout(updateCopyFilterVisibility, 150); });
      setInterval(updateCopyFilterVisibility, 500);
    }
    btn.addEventListener('click', function(){
      if(btn._sbyCopyBusy) return;
      var sel = getCopySelectedStation();
      var curGub = getCopyGubengFilter();

      

      var needNeutral = (sel === 'SGU' && curGub !== 'all');
      if(!needNeutral){
        var rows = getRows();
        doCopyRows(rows, btn);
        return;
      }
      btn._sbyCopyBusy = true;

      

      window.__p100CopySilent = true;
      var done = false;
      var restored = false;
      function clearSilent(){
        window.__p100CopySilent = false;
        setTimeout(function(){ btn._sbyCopyBusy = false; }, 200);
      }
      function restore(){
        if(restored) return;
        restored = true;
        try{ clickCopyGubengOption(curGub); }catch(e){}
        setTimeout(clearSilent, 650);
      }
      setTimeout(function(){
        if(!restored){
          try{ clickCopyGubengOption(curGub); }catch(e){}
        }
        window.__p100CopySilent = false;
        btn._sbyCopyBusy = false;
      }, 4000);
      try{ clickCopyGubengOption('all'); }catch(e){}
      var startAt = Date.now();
      var lastCount = -1;
      var stable = 0;
      var poll = setInterval(function(){
        try{
          var r = getRows();
          if(r.length !== lastCount){ lastCount = r.length; stable = 0; }
          else { stable++; }
          var elapsed = Date.now() - startAt;
          if(stable >= 2 || elapsed > 900){
            if(done) return;
            done = true;
            clearInterval(poll);
            var rows2 = getRows();
            doCopyRows(rows2, btn);
            setTimeout(restore, 150);
          }
        }catch(e){
          if(done) return;
          done = true;
          clearInterval(poll);
          try{ doCopyRows(getRows(), btn); }catch(e2){}
          setTimeout(restore, 150);
        }
      }, 150);
      setTimeout(function(){
